<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - COOKify</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="cook">COOK</span><span class="ify">ify</span></a>
    <div id="google_translate_element"></div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <h1>Sign Up</h1>
      <div id="alert-box"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input class="input-pill" type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input-pill" type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input class="input-pill" type="text" id="phone" required />
        </div>
        <div class="form-group">
          <label for="bio">Bio (optional)</label>
          <textarea class="input-pill" id="bio" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input-pill" type="password" id="password" required />
          <div class="hint-box mt-16">At least 9 characters, no spaces.</div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input class="input-pill" type="password" id="confirm-password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Confirm Sign Up</button>
      </form>

      <p class="form-footer-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <div>
      <h4>Contact Us</h4>
      <p>Contact Info: +91 1234567890</p>
      <p>+91 0987654321</p>
    </div>
    <div class="footer-links text-center"><a href="#">Learn More About Us</a></div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      alertBox.innerHTML = "";

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (password !== confirmPassword) {
        alertBox.innerHTML = `<div class="alert alert-error">Passwords do not match</div>`;
        return;
      }

      try {
        await Api.post("/api/auth/signup", {
          username: document.getElementById("username").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          bio: document.getElementById("bio").value.trim(),
          password,
          confirmPassword,
        });
        window.location.href = "login.html";
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: "en", includedLanguages: "hi,zh-CN,ru,es,fr", layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, "google_translate_element");
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
