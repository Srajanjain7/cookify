<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - COOKify</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .chat-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin: 24px 0; min-height: 480px; }
    .conversation-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; height: fit-content; }
    .conversation-item { display: block; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--text); cursor: pointer; }
    .conversation-item:hover, .conversation-item.active { background: var(--input-bg); }
    .conversation-item .partner { font-weight: 700; }
    .conversation-item .snippet { font-size: 0.78rem; color: var(--text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-thread { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; max-height: 460px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .bubble { max-width: 70%; padding: 8px 14px; border-radius: 16px; font-size: 0.9rem; }
    .bubble.mine { align-self: flex-end; background: var(--primary-gradient); color: #fff; }
    .bubble.theirs { align-self: flex-start; background: var(--input-bg); color: var(--text); }
    .bubble .time { display: block; font-size: 0.65rem; opacity: 0.7; margin-top: 2px; }
    .send-row { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="cook">COOK</span><span class="ify">ify</span></a>
    <ul class="nav-links">
      <li><a href="browse.html">Explore</a></li>
      <li><a href="chat.html">Chat</a></li>
    </ul>
    <div id="google_translate_element"></div>
    <div class="nav-right" id="nav-right"></div>
  </nav>

  <div class="container">
    <h1>Chat</h1>
    <div class="chat-layout">
      <div class="conversation-list" id="conversation-list"><p class="empty-state">Loading...</p></div>
      <div class="chat-thread">
        <div id="thread-header" style="font-weight:700;margin-bottom:12px;">Select a conversation</div>
        <div class="messages" id="messages"></div>
        <form class="send-row" id="send-form">
          <input class="input-pill" type="text" id="message-text" placeholder="Type a message..." autocomplete="off" />
          <button type="submit" class="btn btn-primary" id="send-btn" disabled>Send</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>
      <h4>Contact Us</h4>
      <p>Contact Info: +91 1234567890</p>
      <p>+91 0987654321</p>
    </div>
    <div class="footer-links text-center"><a href="#">Learn More About Us</a></div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: "en", includedLanguages: "hi,zh-CN,ru,es,fr", layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, "google_translate_element");
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
