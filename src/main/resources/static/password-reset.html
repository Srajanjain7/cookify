<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - COOKify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="cook">COOK</span><span class="ify">ify</span></a>
    <div id="google_translate_element"></div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <h1>Forgot Password?</h1>
      <p class="subtitle">We'll email you a code to reset it.</p>
      <div id="alert-box"></div>

      <form id="request-form">
        <div class="form-group">
          <label for="identifier">Username / Email / Phone Number</label>
          <input class="input-pill" type="text" id="identifier" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Code</button>
      </form>

      <form id="confirm-form" class="hidden mt-16">
        <div class="form-group">
          <label for="token">Reset Code (from email)</label>
          <input class="input-pill" type="text" id="token" required />
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input class="input-pill" type="password" id="new-password" required />
          <div class="hint-box mt-16">At least 9 characters, no spaces.</div>
        </div>
        <div class="form-group">
          <label for="confirm-new-password">Confirm New Password</label>
          <input class="input-pill" type="password" id="confirm-new-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Confirm New Password</button>
      </form>

      <p class="form-footer-link"><a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <div>
      <h4>Contact Us</h4>
      <p>Contact Info: +91 1234567890</p>
      <p>+91 0987654321</p>
    </div>
    <div class="footer-links text-center"><a href="#">Learn More About Us</a></div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    const requestForm = document.getElementById("request-form");
    const confirmForm = document.getElementById("confirm-form");
    const alertBox = document.getElementById("alert-box");
    let identifier = "";

    requestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      identifier = document.getElementById("identifier").value.trim();
      try {
        const message = await Api.post("/api/auth/password-reset/request", { identifier }).then(() => "Reset Email Sent");
        alertBox.innerHTML = `<div class="alert alert-success">${message}. Check your email for the code.</div>`;
        confirmForm.classList.remove("hidden");
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });

    confirmForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      const confirmNewPassword = document.getElementById("confirm-new-password").value;
      try {
        await Api.post("/api/auth/password-reset/confirm", {
          identifier,
          token: document.getElementById("token").value.trim(),
          newPassword,
          confirmNewPassword,
        });
        window.location.href = "login.html";
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: "en", includedLanguages: "hi,zh-CN,ru,es,fr", layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, "google_translate_element");
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
