spring.application.name=cookify

# DevTools' automatic restart recreates the DataSource (and the H2
# engine behind it) whenever it detects a classpath change -- e.g. an
# IDE rebuild, or `mvn compile` run in another terminal while
# `spring-boot:run` is already live. If that restart lands mid-request,
# the in-flight transaction's connection gets pulled out from under it,
# surfacing as a misleading "Check constraint invalid" / "The database
# has been closed" error. Only production-off risk here is losing
# DevTools' auto-restart-on-rebuild convenience; LiveReload and the
# rest of DevTools still work, and this has no effect on a packaged
# jar, since DevTools already disables itself there.
spring.devtools.restart.enabled=false

# H2 file-mode database -- zero install, persists to ./data/, swap to
# MySQL/PostgreSQL later by changing only these four properties.
#
# No AUTO_SERVER=TRUE: this app only ever needs one JVM holding the file
# (the H2 console runs in-process via this same DataSource). AUTO_SERVER
# would let a second stray `spring-boot:run` silently attach as a remote
# client; if either process then exits, the survivor's live connection
# gets yanked mid-transaction, surfacing as a misleading "Check
# constraint invalid" / "The database has been closed" error. Without
# it, accidentally starting a second instance fails loudly and
# immediately at startup instead.
spring.datasource.url=jdbc:h2:file:./data/cookifydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail -- no SMTP account has been provisioned for this project yet, so
# emails are logged instead of sent (see LoggingMailService). Set to
# "smtp" and fill in the spring.mail.* properties below for real delivery.
app.mail.mode=log
app.mail.from=no-reply@cookify.local
#spring.mail.host=smtp.example.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Remember-me signing key -- override via env var in any real deployment.
app.remember-me.key=cookify-dev-remember-me-key-change-in-production

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
