spring.application.name=cookify

# H2 file-mode database -- zero install, persists to ./data/, swap to
# MySQL/PostgreSQL later by changing only these four properties.
spring.datasource.url=jdbc:h2:file:./data/cookifydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail -- no SMTP account has been provisioned for this project yet, so
# emails are logged instead of sent (see LoggingMailService). Set to
# "smtp" and fill in the spring.mail.* properties below for real delivery.
app.mail.mode=log
app.mail.from=no-reply@cookify.local
#spring.mail.host=smtp.example.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Remember-me signing key -- override via env var in any real deployment.
app.remember-me.key=cookify-dev-remember-me-key-change-in-production

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
