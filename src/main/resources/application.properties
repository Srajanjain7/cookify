spring.application.name=cookify

# H2 file-mode database -- zero install, persists to ./data/, swap to
# MySQL/PostgreSQL later by changing only these four properties.
spring.datasource.url=jdbc:h2:file:./data/cookifydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
